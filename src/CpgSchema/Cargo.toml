[package]
name = "cpg-schema-contract"
version = "0.1.0"
edition = "2024"

[features]
default = []
json-dialect = ["dep:jsonschema", "dep:serde_json"]

[dependencies]
jsonschema = { version = "=0.60.1", default-features = false, features = ["macros"], optional = true }
serde_json = { version = "1.0", optional = true }

[build-dependencies]
jsonschema = { version = "=0.60.1", default-features = false }
serde_json = "1.0"

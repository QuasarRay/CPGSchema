[package]
name = "cpg-schema-json"
version = "0.1.0"
edition = "2024"
autobins = false
license-file = "../LICENSE.MD"
description = "Independent Code Property Graph JSON Schema dialect; UNVERIFIED"
[dependencies]
jsonschema = { version = "=0.60.1", default-features = false }
serde_json = { version = "1.0", features = ["preserve_order"] }
derive-deftly = "=1.14.0"
cgp = { git = "https://github.com/contextgeneric/cgp.git", rev = "eca0c5fda60d87cf048460f5abdd3b6e82da5e0f" }

[[bin]]
name = "JsonSchemaProtogen"
path = "src/bin/Protogen.rs"

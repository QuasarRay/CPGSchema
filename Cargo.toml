[package]
name = "CPGSchema"
version = "0.1.0"
edition = "2024"
description = "Native Rust Code Property Graph schema; implementation milestone, UNVERIFIED"
license-file = "LICENSE.MD"

[workspace]
members = [".", "JsonSchema"]
exclude = ["cgp", "derive-deftly", "jsonschema", "src/CpgSchema", "src/SchemaBase", "src/Type", "src/FileSystem"]
resolver = "3"

[features]
default = []
json-io = ["dep:serde_json"]

[dependencies]
cgp = { git = "https://github.com/contextgeneric/cgp.git", rev = "eca0c5fda60d87cf048460f5abdd3b6e82da5e0f" }
derive-deftly = "=1.14.0"
serde_json = { version = "1.0", optional = true, features = ["preserve_order"] }

[package.metadata.sources]
codepropertygraph = "d02d76ea5c9e3b398317d334228d7e8e78ab45aa"
flatgraph = "0.1.36"
cgp = "eca0c5fda60d87cf048460f5abdd3b6e82da5e0f"
